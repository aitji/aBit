<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>aToc demo</title>
    <link rel="stylesheet" href="aitji/@1.0.0/global.css">
    <link rel="stylesheet" href="aitji/@1.0.0/pages/app.css">
    <style>
        /* demo-only */
        .with-toc { margin-inline: auto; padding-inline: 20px; }
        .demo-controls { display: flex; flex-wrap: wrap; gap: .5rem .9rem; align-items: center; padding: 1rem 0; font: 0.78rem var(--font-mono); color: var(--text-muted); }
        .demo-controls select, .demo-controls button { font: inherit; background: var(--surface); color: var(--text); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: .25rem .5rem; cursor: pointer; }
        .post-content { padding-bottom: 3rem; }
        .toc-note { font-size: .8rem; color: var(--text-faint); }
        .fill { height: 5rem; }
    </style>
</head>

<body>
    <header class="site-header">
        <div class="container">
            <div class="nav-bar">
                <a class="brand" href="#">aitji<span class="brand-dot">.</span></a>
                <div class="tab-bar-wrap">
                    <div class="tab-bar"><button class="tab-btn active">toc demo</button></div>
                </div>
            </div>
        </div>
    </header>

    <div class="container">
        <div class="demo-controls" id="controls">
            <label>layout <select id="layout"><option value="grid">.with-toc grid</option><option value="plain">plain (no grid)</option></select></label>
            <label>highlight <select id="highlight"><option>focus</option><option>visible</option><option>both</option><option>none</option></select></label>
            <label>visibleBy <select id="visibleBy"><option>section</option><option>heading</option></select></label>
            <label>subheads <select id="subheads"><option value="true">true</option><option value="false">false</option></select></label>
            <label>mobile <select id="mobile"><option>sticky-top</option><option>sticky-bottom</option><option>element-top</option><option>element-bottom</option><option value="false">off</option></select></label>
            <button id="addH">+ add section</button>
            <button id="swap">swap page (SPA)</button>
        </div>
    </div>

    <main id="view"></main>

    <footer class="site-footer"><div class="container site-footer-inner"><span class="site-footer-copy">footer</span></div></footer>

    <script src="aitji/@1.0.0/components/toc.js"></script>
    <script>
        const $ = (s) => document.querySelector(s);
        const lorem = 'Lorem ipsum dolor sit amet, consectetur adipiscing elit. Sed do eiusmod tempor incididunt ut labore et dolore magna aliqua. Ut enim ad minim veniam, quis nostrud exercitation ullamco laboris nisi ut aliquip ex ea commodo consequat. Duis aute irure dolor in reprehenderit in voluptate velit esse cillum dolore.';
        const p = (n = 3) => Array.from({ length: n }, () => `<p>${lorem}</p>`).join('');
        let pageNo = 0, extra = 0;

        function article() {
            const names = pageNo % 2 ? ['Alpha', 'Bravo', 'Charlie', 'Delta'] : ['Overview', 'Install', 'Usage', 'Options', 'Highlighting', 'Mobile', 'FAQ'];
            let h = `<h1 class="post-title" style="margin:1.5rem 0">Page ${pageNo + 1}: the quick brown fox</h1>${p(1)}`;
            names.forEach((n, i) => {
                h += `<h2>${n}</h2>${p(3)}`;
                if (i % 2 === 0) h += `<h3>${n} details</h3>${p(2)}<h3>${n} gotchas</h3>${p(2)}`;
                if (i === 2) h += `<h2 class="toc-ignore">Ignored heading</h2>${p(1)}<div class="toc-ignore"><h3>Ignored by ancestor</h3></div>`;
                if (i === 1) h += `<h2>ภาษาไทย ทดสอบ</h2>${p(2)}`;
            });
            for (let i = 0; i < extra; i++) h += `<h2>Added later ${i + 1}</h2>${p(2)}`;
            return `<article class="post-content" data-toc-root>${h}</article>`;
        }

        function render() {
            $('#view').innerHTML = $('#layout').value === 'grid'
                ? `<div class="with-toc">${article()}<aside class="toc"></aside></div>`
                : `<div class="container">${article()}</div>`;
        }

        function opts() {
            return {
                highlight: $('#highlight').value, visibleBy: $('#visibleBy').value,
                subheads: $('#subheads').value === 'true',
                mobile: $('#mobile').value === 'false' ? false : $('#mobile').value
            };
        }

        render();
        aToc.init(opts());

        ['highlight', 'visibleBy', 'subheads', 'mobile'].forEach(id => $('#' + id).onchange = () => aToc.instance.update(opts()));
        $('#layout').onchange = () => { render(); aToc.instance.update(opts()); };   // DOM swap only: observer + update handle the rest
        $('#addH').onclick = () => { extra++; const a = $('.post-content'); a.insertAdjacentHTML('beforeend', `<h2>Added later ${extra}</h2>${p(2)}`); };
        $('#swap').onclick = () => { pageNo++; render(); };
    </script>
</body>

</html>
